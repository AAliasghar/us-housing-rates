# CI: on every push to main and every pull request, GitHub runs the tests on a clean Linux computer.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Copy the code from this repo onto the computer
      - name: Check out the code
        uses: actions/checkout@v4

      # 2. Install the same Python version as on my PC
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 3. Install the libraries listed in requirements-dev.txt
      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4. Run the tests. If one fails, this step fails and the pull request shows a red cross.
      - name: Run tests
        run: pytest -v
